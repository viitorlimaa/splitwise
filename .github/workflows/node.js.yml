name: Splitwise API CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: splitwise
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d splitwise"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/splitwise?schema=public
      JWT_SECRET: ci-test-secret

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar Prisma Client
        run: pnpm prisma generate

      - name: Rodar lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Rodar testes
        run: pnpm test

      - name: Aplicar migrations no banco de teste
        run: pnpm exec prisma migrate deploy

      - name: Rodar testes e2e
        run: pnpm test:e2e

      - name: Build da aplicação
        run: pnpm build
