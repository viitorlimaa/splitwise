services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: splitwise_api
    ports:
      - "3000:3000"
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-splitwise}?schema=public
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "pnpm install && pnpm prisma generate && pnpm start:dev"

  db:
    image: postgres:16-alpine
    container_name: splitwise-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-splitwise}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-splitwise}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
